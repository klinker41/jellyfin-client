name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Format + compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure CI Gradle limits
        run: |
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home"
          cat <<'EOF' >> "$gradle_home/gradle.properties"
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          kotlin.daemon.jvm.options=-Xmx2g
          org.gradle.workers.max=4
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check formatting
        run: ./gradlew ktfmtCheck

      - name: Check cancellation rethrows
        if: always()
        run: ./gradlew checkCancellationRethrow

      - name: Check item projection
        if: always()
        run: ./gradlew checkItemProjection

      - name: Compile
        if: always()
        run: ./gradlew compileDebugKotlin

      - name: Unit tests
        if: always()
        run: ./gradlew testDebugUnitTest

      - name: Screenshot tests
        if: always()
        run: ./gradlew :app:testDebugScreenshotTestDefaultTestSuite

      - name: Android Lint
        if: always()
        run: ./gradlew :app:lintDebug
